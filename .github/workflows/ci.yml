name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.configuration }})
    # Apple Silicon runner. Listnr targets macOS 14+, but the macos-14 runner
    # image has been retired by GitHub. The deployment-target floor is enforced
    # by `platforms: [.macOS(.v14)]` in Package.swift, not by the runner OS.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ matrix.configuration }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.configuration }}-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -c ${{ matrix.configuration }}

      - name: Test
        run: swift test -c ${{ matrix.configuration }}

      - name: Check version consistency
        if: matrix.configuration == 'release'
        run: ./scripts/check-version.sh

      - name: Smoke-check the CLI
        # Subcommands that touch neither audio hardware nor permissions, so they
        # are safe on a headless runner with no microphone.
        if: matrix.configuration == 'debug'
        run: |
          .build/debug/listnr --help
          .build/debug/listnr models list
          .build/debug/listnr start --help

  concurrency-check:
    name: Strict concurrency
    runs-on: macos-15
    # The diagnostic count in Sources/ reached zero in 0.1.1-beta. This
    # job now enforces it: any new strict-concurrency warning fails the build.

    steps:
      - uses: actions/checkout@v5

      - name: Build with complete concurrency checking
        run: swift build -Xswiftc -strict-concurrency=complete 2>&1 | tee build.log

      # Dependency warnings are not ours; report only our own sources.
      - name: Summarise diagnostics in Listnr sources
        run: |
          grep -E "Sources/(ListnrCore|listnr)/.*(warning|error):" build.log \
            | sed -E 's#.*/Sources/(ListnrCore|listnr)/##' | sort -u > diagnostics.txt || true
          count=$(wc -l < diagnostics.txt | tr -d ' ')
          {
            echo "### Strict-concurrency diagnostics in \`Sources/\`: **$count**"
            echo
            if [ "$count" -gt 0 ]; then
              echo '```'
              cat diagnostics.txt
              echo '```'
              echo
              echo "Every one of these is an error under the Swift 6 language mode."
            else
              echo "None. :tada:"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::error title=Strict concurrency::$count new diagnostic(s) in Sources/; the count must stay at zero."
            exit 1
          fi
